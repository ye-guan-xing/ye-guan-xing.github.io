<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>埋点 Demo · 纯本地 console 模拟</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1623; color: #e6edf3;
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      display: flex; height: 100vh; overflow: hidden;
    }
    /* 左：业务区 */
    .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid #1f2a3a; }
    .toolbar { padding: 12px 16px; background: #141d2e; border-bottom: 1px solid #1f2a3a; font-size: 13px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
    .toolbar label { display: inline-flex; align-items: center; gap: 6px; color: #9aa7b8; }
    .toolbar .state { color: #4a90d9; font-weight: 600; }
    #app { flex: 1; overflow-y: auto; padding: 16px; }
    .page { max-width: 520px; }
    .nav { display: flex; align-items: center; gap: 12px; height: 44px; font-weight: 600; }
    .nav .back { background: none; border: 1px solid #2a3a55; color: #4a90d9; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    .hint { color: #6b7a8f; font-size: 13px; margin: 14px 0; line-height: 1.6; }
    .list { list-style: none; }
    .item { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #141d2e; border-radius: 10px; margin-bottom: 10px; cursor: pointer; border: 1px solid #1f2a3a; }
    .item:hover { border-color: #4a90d9; }
    .item .t { font-size: 15px; }
    .item .badge { font-size: 12px; color: #d9774a; border: 1px solid #6b3a2d; padding: 2px 8px; border-radius: 10px; }
    .dual { width: 100%; margin-top: 8px; padding: 12px; background: #2d4a6b; color: #fff; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; }
    /* 右：事件流 */
    .stream-wrap { width: 420px; display: flex; flex-direction: column; background: #0b111c; }
    .stream-head { padding: 10px 14px; border-bottom: 1px solid #1f2a3a; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #9aa7b8; }
    .stream-head button { background: none; border: 1px solid #2a3a55; color: #9aa7b8; border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
    #tracker-stream { flex: 1; overflow-y: auto; padding: 8px; }
    .tr-row { padding: 8px 10px; border-bottom: 1px solid #141d2e; }
    .tr-tag { font-size: 11px; font-weight: 700; }
    .tr-type { margin-left: 8px; font-size: 11px; color: #6b7a8f; background: #1f2a3a; padding: 1px 6px; border-radius: 4px; }
    .tr-payload { margin-top: 6px; font-size: 11px; color: #9aa7b8; white-space: pre-wrap; word-break: break-all; line-height: 1.5; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    @media (max-width: 760px) { body { flex-direction: column; } .stream-wrap { width: 100%; height: 40vh; border-top: 1px solid #1f2a3a; } }
  </style>
</head>
<body>
  <div class="stage">
    <div class="toolbar">
      <span style="font-weight:700;color:#4a90d9">埋点 Demo</span>
      <label><input type="checkbox" id="cfg-inapp" /> App 内</label>
      <span class="state" id="cfg-inapp-state">浏览器(火山静默)</span>
      <label><input type="checkbox" id="cfg-sensors" checked /> 神策</label>
      <label><input type="checkbox" id="cfg-custom" checked /> 自研日志</label>
    </div>
    <div id="app"></div>
  </div>
  <div class="stream-wrap">
    <div class="stream-head"><span>埋点事件流（实时）</span><button id="clear">清空</button></div>
    <div id="tracker-stream"></div>
  </div>

  <script src="tracker.js"></script>
  <script src="app.js"></script>
</body>
</html>
